[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-agent-audit"
version = "0.1.0"
description = "Checkpoint and source-provenance utilities for the RSI-top takehome release"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.8"]

[tool.setuptools]
packages = ["meta_audit"]

[tool.setuptools.package-data]
meta_audit = ["py.typed"]


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["meta_audit"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
